name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/infoharness' }}
      DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
      EMAIL: ${{ vars.DEPLOY_EMAIL }}
      EXTRA_ARGS: ${{ vars.DEPLOY_ARGS }}
    steps:
      - uses: actions/checkout@v5

      - name: Check configuration
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing DEPLOY_HOST(secret)"
          [ "${{ secrets.DEPLOY_SSH_KEY != '' }}" = "true" ] || missing="$missing DEPLOY_SSH_KEY(secret)"
          [ "${{ secrets.DEPLOY_KNOWN_HOSTS != '' }}" = "true" ] || missing="$missing DEPLOY_KNOWN_HOSTS(secret)"
          [ -n "$DOMAIN" ] || missing="$missing DEPLOY_DOMAIN(variable)"
          if [ -n "$missing" ]; then
            echo "::error::Missing:$missing — run scripts/setup-deploy-access.sh on the server and add what it prints."
            exit 1
          fi

      - name: Set up SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $HOST
            Port $PORT
            User deploy
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ServerAliveInterval 30
            ConnectTimeout 20
            ConnectionAttempts 3
          EOF
          # The server's sshd sometimes drops a connection while it is busy; retry before giving up.
          for i in 1 2 3 4 5 6 7 8; do
            ssh server 'echo connected to $(hostname)' && break
            [ "$i" = 8 ] && { echo "::error::Could not reach the server over SSH after 8 tries (is it up, and is port $PORT open to GitHub?)"; exit 1; }
            echo "SSH attempt $i failed, retrying in 20s..."; sleep 20
          done

      - name: Upload code
        run: |
          ssh server "mkdir -p '$DEPLOY_PATH' 2>/dev/null; test -w '$DEPLOY_PATH'" || {
            echo "::error::User 'deploy' can't write to $DEPLOY_PATH on the server. Fix: sudo mkdir -p $DEPLOY_PATH && sudo chown -R deploy:deploy $DEPLOY_PATH  (or set the DEPLOY_PATH variable to /opt/infoharness)"
            exit 1
          }
          rsync -az --delete \
            --exclude '.git/' --exclude '.github/' --exclude '.env' --exclude '*.db' \
            --exclude '__pycache__/' --exclude '.pytest_cache/' \
            ./ "server:$DEPLOY_PATH/"

      - name: Sync app settings to the server
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          LS_WEBHOOK_SECRET: ${{ secrets.LS_WEBHOOK_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          CHECKOUT_URL: ${{ vars.CHECKOUT_URL }}
          PRO_PRICE: ${{ vars.PRO_PRICE }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          WITH_BROWSER: ${{ vars.WITH_BROWSER }}
          RENDER_JS: ${{ vars.RENDER_JS }}
          WORKER_MEM: ${{ vars.WORKER_MEM }}
        run: |
          # Only non-empty values are written, into the server's .env (never printed). Empty = leave as is.
          lines=""
          for k in RESEND_API_KEY SECRET_KEY LS_WEBHOOK_SECRET ANTHROPIC_API_KEY MAIL_FROM ADMIN_EMAILS CHECKOUT_URL PRO_PRICE LLM_PROVIDER CONTACT_EMAIL WITH_BROWSER RENDER_JS WORKER_MEM; do
            v="${!k}"; [ -n "$v" ] && lines+="$k=$v"$'\n'
          done
          [ -n "$lines" ] || { echo "No extra settings configured."; exit 0; }
          printf '%s' "$lines" | ssh server "sudo python3 -c '
          import sys
          path = \"$DEPLOY_PATH/.env\"
          new = dict(l.rstrip(\"\\n\").split(\"=\", 1) for l in sys.stdin if \"=\" in l)
          out, seen = [], set()
          for line in open(path).read().splitlines():
              k = line.split(\"=\", 1)[0]
              if k in new: out.append(k + \"=\" + new[k]); seen.add(k)
              else: out.append(line)
          out += [k + \"=\" + v for k, v in new.items() if k not in seen]
          open(path, \"w\").write(\"\\n\".join(out) + \"\\n\")
          print(\"updated:\", \", \".join(sorted(new)))
          '"

      - name: Deploy
        run: |
          ssh server "cd '$DEPLOY_PATH' && chmod +x deploy.sh scripts/*.sh && sudo ./deploy.sh '$DOMAIN' '$EMAIL' $EXTRA_ARGS"

      - name: Smoke test (public URL)
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "https://$DOMAIN/healthz"; then echo; echo "Live at https://$DOMAIN"; exit 0; fi
            sleep 10
          done
          echo "::warning::App is healthy on the server but https://$DOMAIN isn't reachable yet (DNS or certificate still pending?)"

      - name: Live test (real scan through the public site)
        env:
          TEST_URL: ${{ vars.DEPLOY_TEST_URL }}
        run: python3 scripts/live_test.py "https://$DOMAIN" "$TEST_URL"

      - name: Show logs on failure
        if: failure()
        run: ssh server "cd '$DEPLOY_PATH' && sudo docker compose logs --tail 80 app worker caddy" || true
