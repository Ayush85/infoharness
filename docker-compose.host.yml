# Use the server's existing PostgreSQL (and any other local services such as ClickHouse).
# Containers share the host network, so "127.0.0.1:5432" in DATABASE_URL means the server itself —
# no changes to postgresql.conf / pg_hba.conf needed. The app still listens on localhost only.
services:
  app:
    network_mode: host
    ports: !reset []
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
    command: ["uvicorn", "app.main:app", "--host", "127.0.0.1", "--port", "${APP_PORT:-8000}", "--workers", "2"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:${APP_PORT:-8000}/healthz', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  worker:
    network_mode: host
    environment:
      DATABASE_URL: ${DATABASE_URL:-}

  caddy:
    network_mode: host
    ports: !reset []
    environment:
      UPSTREAM: 127.0.0.1:${APP_PORT:-8000}
