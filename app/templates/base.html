<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}infoharness — check your docs before your AI reads them{% endblock %}</title>
<meta name="description" content="{% block description %}Scan a help center or docs site for contradictions, duplicates, outdated pages and broken links — the things that make AI assistants give wrong answers.{% endblock %}">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css?v={{ version }}">
{% block head %}{% endblock %}
</head>
<body>
<header class="site-head">
  <a class="wordmark" href="/" aria-label="infoharness home">info<span>harness</span></a>
  <nav><a href="/bot">About the crawler</a></nav>
</header>
<main id="main">
{% block content %}{% endblock %}
</main>
<footer class="site-foot">
  <p>infoharness reads public pages only, respects robots.txt and never executes scripts.</p>
  <p><a href="/bot">How the crawler works</a></p>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
